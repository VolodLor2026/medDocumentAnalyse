<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Верифікація медичних документів</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />

  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f8fafc);
      --text-color: var(--tg-theme-text-color, #0f172a);
      --hint-color: var(--tg-theme-hint-color, #64748b);
      --secondary-bg-color: var(--tg-theme-secondary-bg-color, #ffffff);
      --button-color: var(--tg-theme-button-color, #2563eb);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .card {
      background-color: var(--secondary-bg-color);
    }

    /* Анімація спінера */
    .loader {
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top-color: var(--button-color);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="p-4 pb-24 antialiased min-h-screen flex flex-col justify-between">

  <div id="app" class="w-full max-w-lg mx-auto">
    <!-- Стан завантаження (Loader) -->
    <div id="loading-state" class="flex flex-col items-center justify-center min-h-[60vh] py-20">
      <div class="loader mb-4"></div>
      <p class="text-sm font-medium" style="color: var(--hint-color);">Отримання документа...</p>
    </div>

    <!-- Стан помилки або порожнього списку -->
    <div id="status-message" class="hidden text-center py-16 card p-6 rounded-2xl shadow-sm border border-gray-100">
      <div id="status-icon" class="text-4xl mb-3">📋</div>
      <h3 id="status-title" class="text-lg font-bold mb-1">Немає завдань</h3>
      <p id="status-desc" class="text-sm" style="color: var(--hint-color);">Усі сумнівні поля вже верифіковано або записів не знайдено.</p>
    </div>

    <!-- Основний контент (Форма) -->
    <div id="content-state" class="hidden space-y-4">
      
      <!-- Шапка документа -->
      <header class="card p-4 rounded-2xl shadow-sm border border-gray-100 border-opacity-10 space-y-3">
        <div class="flex items-start justify-between gap-2">
          <div>
            <span class="text-xs uppercase tracking-wider font-semibold" style="color: var(--hint-color);">Медичний документ</span>
            <h1 id="doc-name" class="text-lg font-bold leading-snug mt-0.5">—</h1>
          </div>
          <!-- Рівень впевненості ШІ -->
          <div id="confidence-badge" class="px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap bg-gray-100 text-gray-700">
            ШІ: <span id="confidence-value">0%</span>
          </div>
        </div>

        <div class="pt-2 border-t border-gray-100 border-opacity-20 flex items-center gap-2">
          <svg class="w-4 h-4 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <p class="text-sm">
            Пацієнт: <strong id="patient-name">—</strong>
          </p>
        </div>
      </header>

      <!-- Заголовок списку -->
      <div class="flex items-center justify-between px-1">
        <h2 class="text-sm font-semibold tracking-wide uppercase" style="color: var(--hint-color);">
          Сумнівні поля (<span id="fields-count">0</span>)
        </h2>
      </div>

      <!-- Список сумнівних полів -->
      <form id="corrections-form" class="space-y-4">
        <div id="fields-container" class="space-y-4">
          <!-- Генерується динамічно через JS -->
        </div>
      </form>

    </div>
  </div>

  <script>
    // ==========================================
    // НАЛАШТУВАННЯ ТА КОНФІГУРАЦІЯ
    // ========================================== https://karlak.app.n8n.cloud/webhook/get-document
    // Вкажіть ваш базовий домен інстансу n8n:
    const N8N_BASE_URL = "https://karlak.app.n8n.cloud";

    const tg = window.Telegram?.WebApp;

    // Ініціалізація Telegram Mini App
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Отримання telegram_id (фолбек на тестовий ID для налагодження у звичайному браузері)
    const telegramId = tg?.initDataUnsafe?.user?.id || 123456789;

    // Стан форми
    let fieldsData = [];

    // Елементи DOM
    const loadingState = document.getElementById("loading-state");
    const contentState = document.getElementById("content-state");
    const statusMessage = document.getElementById("status-message");
    const statusTitle = document.getElementById("status-title");
    const statusDesc = document.getElementById("status-desc");
    const statusIcon = document.getElementById("status-icon");

    // ==========================================
    // ЗАВАНТАЖЕННЯ ДАНИХ (GET)
    // ==========================================
    async function fetchDocument() {
      try {
        const response = await fetch(`${N8N_BASE_URL}/webhook/get-document?telegram_id=${telegramId}`, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) {
          throw new Error(`Помилка сервера: ${response.status}`);
        }

        const data = await response.json();
        renderDocument(data);
      } catch (error) {
        console.error("Помилка завантаження даних:", error);
        showStatus("Помилка", "Не вдалося отримати документ. Спробуйте пізніше або зверніться до техпідтримки.", "⚠️");
      }
    }

    // ==========================================
    // ВІДОБРАЖЕННЯ ДАНИХ НА СТОРІНЦІ
    // ==========================================
    function renderDocument(data) {
      loadingState.classList.add("hidden");

      // Фільтруємо поля: med_uncertain_logs де is_corrected == false
      const uncertainFields = (data?.med_uncertain_logs || []).filter(item => !item.is_corrected);

      if (!data || !data.document_name || uncertainFields.length === 0) {
        showStatus("Все перевірено", "Немає сумнівних ділянок, які потребують вашої уваги.", "✅");
        return;
      }

      fieldsData = uncertainFields;

      // Заповнюємо шапку документа
      document.getElementById("doc-name").innerText = data.document_name || "Медичний висновок";
      document.getElementById("patient-name").innerText = data.patient_name || "Не вказано";
      document.getElementById("fields-count").innerText = uncertainFields.length;

      // Бейдж впевненості ШІ
      const score = Math.round(Number(data.confidence_score || 0));
      const badge = document.getElementById("confidence-badge");
      document.getElementById("confidence-value").innerText = `${score}%`;

      if (score >= 80) {
        badge.className = "px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap bg-green-100 text-green-800";
      } else if (score >= 50) {
        badge.className = "px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap bg-yellow-100 text-yellow-800";
      } else {
        badge.className = "px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap bg-red-100 text-red-800";
      }

      // Генерація карток полів
      const container = document.getElementById("fields-container");
      container.innerHTML = "";

      uncertainFields.forEach((field, index) => {
        const card = document.createElement("div");
        card.className = "card p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3";

        // Поле вводу: довгий текст у textarea, короткий у input
        const isLongText = (field.recognized_value || "").length > 40;
        const inputElement = isLongText 
          ? `<textarea 
                id="input-${index}" 
                rows="3" 
                class="w-full text-sm p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-transparent"
                placeholder="Введіть правильне значення...">${escapeHtml(field.recognized_value || "")}</textarea>`
          : `<input 
                type="text" 
                id="input-${index}" 
                value="${escapeHtml(field.recognized_value || "")}" 
                class="w-full text-sm p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-transparent"
                placeholder="Введіть правильне значення..." />`;

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-sm font-bold tracking-wide text-blue-600">${escapeHtml(field.field_name || "Поле")}</span>
            <span class="text-xs bg-red-50 text-red-600 px-2 py-0.5 rounded-md font-medium">Потребує уваги</span>
          </div>

          <!-- Причина сумніву -->
          <div class="bg-amber-50 border-l-2 border-amber-400 p-2.5 rounded-r-lg text-xs text-amber-900">
            <strong>Сумнів ШІ:</strong> ${escapeHtml(field.uncertainty_reason || "Низька чіткість розпізнавання")}
          </div>

          <!-- Оригінальний розпізнаний текст -->
          <div class="text-xs">
            <span class="font-medium" style="color: var(--hint-color);">Оригінал розпізнавання:</span>
            <div class="mt-1 p-2 bg-gray-50 rounded-lg text-gray-700 italic border border-gray-100 select-all">
              "${escapeHtml(field.recognized_value || "—")}"
            </div>
          </div>

          <!-- Поле для введення лікаря -->
          <div class="pt-1">
            <label for="input-${index}" class="block text-xs font-semibold mb-1" style="color: var(--hint-color);">
              Виправлене значення:
            </label>
            ${inputElement}
          </div>
        `;

        container.appendChild(card);
      });

      contentState.classList.remove("hidden");

      // Налаштовуємо та показуємо нативну кнопку Telegram
      if (tg?.MainButton) {
        tg.MainButton.setText("Зберегти виправлення");
        tg.MainButton.show();
        tg.MainButton.enable();
        tg.MainButton.onClick(handleSubmit);
      }
    }

    // ==========================================
    // ВІДПРАВКА ДАНИХ (POST)
    // ==========================================
    async function handleSubmit() {
      if (!tg?.MainButton) return;

      tg.MainButton.showProgress();
      tg.MainButton.disable();

      // Збір виправлених даних
      const corrections = fieldsData.map((field, index) => {
        const input = document.getElementById(`input-${index}`);
        return {
          field_name: field.field_name,
          corrected_value: input ? input.value.trim() : ""
        };
      });

      const payload = {
        telegram_id: Number(telegramId),
        corrections: corrections
      };

      try {
        const response = await fetch(`${N8N_BASE_URL}/webhook/save-corrections`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`Сервер повернув код помилки: ${response.status}`);
        }

        tg.MainButton.hideProgress();
        
        // Сповіщення про успіх та закриття
        if (tg.showAlert) {
          tg.showAlert("Виправлення успішно збережено!", () => {
            tg.close();
          });
        } else {
          alert("Виправлення успішно збережено!");
          tg.close();
        }

      } catch (error) {
        console.error("Помилка надсилання виправлень:", error);
        tg.MainButton.hideProgress();
        tg.MainButton.enable();

        if (tg.showAlert) {
          tg.showAlert("Не вдалося зберегти дані. Спробуйте ще раз.");
        } else {
          alert("Помилка збереження. Перевірте з'єднання з мережею.");
        }
      }
    }

    // Допоміжна функція екранування тексту
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // Відображення заглушки / стану сповіщень
    function showStatus(title, description, icon) {
      loadingState.classList.add("hidden");
      contentState.classList.add("hidden");
      if (tg?.MainButton) tg.MainButton.hide();

      statusTitle.innerText = title;
      statusDesc.innerText = description;
      statusIcon.innerText = icon;
      statusMessage.classList.remove("hidden");
    }

    // Запуск отримання документа після завантаження DOM
    document.addEventListener("DOMContentLoaded", fetchDocument);
  </script>
</body>
</html>
